name: Update GitHub profile cards

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/github-trophies.svg"
      - "assets/github-activity-graph.svg"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=dooddyfire&theme=onestar&no-bg=true&no-frame=true&row=2&column=4&margin-w=8&margin-h=8&rank=-UNKNOWN
          path: assets/github-trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: dooddyfire
          options: bg_color=0D152C&color=9DBAE8&line=EAC777&point=67B5FF&area=true&hide_border=true
          output_path: assets/github-activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit profile cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-trophies.svg assets/github-activity-graph.svg
          git diff --staged --quiet && exit 0
          git commit -m "Update GitHub trophy and activity graph"
          git push
